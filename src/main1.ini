#include <math.h>
#include <Arduino.h>

int stepPin = 13;
int dirPin = 12;

// 全域變數，用來標記是否要緊急停止
volatile bool stopFlag = false; 

// 修正後的馬達控制函式（加入 stopFlag 檢查，能隨時中斷）
void MotorRampStepSym(bool dir,
                      long steps,
                      int delayTimeStart,  // 起步(慢)
                      int rampSteps,
                      int minDelay)        // 加速/減速各 rampSteps 步
{
  if (steps <= 0) return;

  digitalWrite(dirPin, dir);

  // 參數防呆
  if (delayTimeStart < minDelay) delayTimeStart = minDelay;
  if (rampSteps < 1) rampSteps = 1;

  // 若總步數太少，rampSteps 不能超過 steps/2
  if (2L * rampSteps > steps) {
    rampSteps = steps / 2;
    if (rampSteps < 1) rampSteps = 1;
  }

  // 每一步 delay 變化量
  int delta = (delayTimeStart - minDelay) / rampSteps;
  if (delta < 1) delta = 1;

  int d = delayTimeStart;

  for (long i = 0; i < steps; i++) {
    // 檢查是否有來自 Python 的停止指令
    if (stopFlag) {
      break; 
    }

    // 在移動中持續檢查是否有新的 Serial 指令傳入 (避免移動時卡死在 for 裡面)
    if (Serial.available() > 0) {
      String cmd = Serial.readStringUntil('\n');
      cmd.trim();
      if (cmd == "STOP") {
        stopFlag = true;
        Serial.println("STOPPED");
        break;
      }
    }

    digitalWrite(stepPin, LOW);
    delayMicroseconds(d);
    digitalWrite(stepPin, HIGH);
    delayMicroseconds(d);

    // 加速、巡航、減速
    if (i < rampSteps) {
      d -= delta;
      if (d < minDelay) d = minDelay;
    } else if (i >= (steps - rampSteps)) {
      d += delta;
      if (d > delayTimeStart) d = delayTimeStart;
    } else {
      d = minDelay;
    }
  }
}

void setup() {
  pinMode(stepPin, OUTPUT);
  pinMode(dirPin, OUTPUT);
  digitalWrite(stepPin, HIGH);
  digitalWrite(dirPin, HIGH);
  
  // 必須與 Python GUI 的 BAUD_RATE 一致
  Serial.begin(115200); 
}

void loop() {
  // 持續監聽電腦（Python GUI）送過來的指令
  if (Serial.available() > 0) {
    String input = Serial.readStringUntil('\n');
    input.trim();

    if (input.startsWith("MOVE")) {
      stopFlag = false; // 重設停止標記

      // 解析 Python 傳來的指令格式： "MOVE direction distance speed ramp"
      // 例如: MOVE 1 5.0 3.0 1.0
      int firstSpace = input.indexOf(' ');
      int secondSpace = input.indexOf(' ', firstSpace + 1);
      int thirdSpace = input.indexOf(' ', secondSpace + 1);
      int fourthSpace = input.indexOf(' ', thirdSpace + 1);

      if (firstSpace != -1 && secondSpace != -1 && thirdSpace != -1 && fourthSpace != -1) {
        int dir = input.substring(firstSpace + 1, secondSpace).toInt();
        float distance = input.substring(secondSpace + 1, thirdSpace).toFloat();
        float speed = input.substring(thirdSpace + 1, fourthSpace).toFloat();
        float ramp = input.substring(fourthSpace + 1).toFloat();

        // 根據你硬體的細節，將 distance、speed 換算成步數（steps）與延遲（delay）
        // 這裡暫以簡易比例換算，你可以依實際螺桿導程或齒輪比調整：
        long steps = distance * 100;// 假設每 mm 需要 400 步
        int minDelay = 1000000 / (speed * 100) / 2; // 計算對應速度的 delay 時間
        int initDelay = minDelay * 3; // 起步延遲設為 cruise 的 3 倍
        int rampSteps = ramp * 100; // 緩衝步數

        Serial.println("ACK_MOVE"); // 回傳給 Python
        MotorRampStepSym(dir == 1, steps, initDelay, rampSteps, minDelay);
        Serial.println("MOVE_DONE");
      }
    } 
    else if (input == "STOP") {
      stopFlag = true;
      Serial.println("ACK_STOP");
    } 
    else if (input == "PING") {
      Serial.println("PONG");
    } 
    else if (input == "STATUS") {
      Serial.println("IDLE");
    }
  }
}
