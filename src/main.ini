#include <Arduino.h>
#include <math.h>

const int stepPin = 12;
const int dirPin  = 13;

// ===== 機構參數 =====
// 你目前量到大約 100 steps = 1 mm
const float STEPS_PER_MM = 100.0;

// ===== 速度限制，可依你的機構修改 =====
const float MAX_SPEED_MM_S = 30.0;
const float MIN_SPEED_MM_S = 0.05;

// ===== 起步速度 =====
// 馬達從這個速度開始加速
const float START_SPEED_MM_S = 0.5;

// Serial buffer
const int LINE_BUF_SIZE = 80;
char lineBuf[LINE_BUF_SIZE];
int lineIndex = 0;

bool isBusy = false;
bool stopRequested = false;

// 避免 delayMicroseconds() 傳入太大的數字
void delayMicrosecondsSafe(unsigned long us) {
  while (us >= 1000) {
    delay(1);
    us -= 1000;
  }

  if (us > 0) {
    delayMicroseconds(us);
  }
}

// 送出一個 step pulse
// 維持你原本的 LOW delay + HIGH delay
void doStepPulse(unsigned long halfPeriodUS) {
  digitalWrite(stepPin, LOW);
  delayMicrosecondsSafe(halfPeriodUS);

  digitalWrite(stepPin, HIGH);
  delayMicrosecondsSafe(halfPeriodUS);
}

// mm 轉 steps
long mmToSteps(float mm) {
  return lround(mm * STEPS_PER_MM);
}

// mm/s 轉成 half period delay
// 因為你的 step pulse 是 LOW delay + HIGH delay
// 所以完整 step 週期 = 2 * halfPeriodUS
unsigned long speedToHalfPeriodUS(float speedMM_S) {
  if (speedMM_S < MIN_SPEED_MM_S) {
    speedMM_S = MIN_SPEED_MM_S;
  }

  float stepsPerSecond = speedMM_S * STEPS_PER_MM;

  if (stepsPerSecond <= 0) {
    stepsPerSecond = 1;
  }

  float stepPeriodUS = 1000000.0 / stepsPerSecond;
  unsigned long halfPeriodUS = (unsigned long)(stepPeriodUS / 2.0);

  if (halfPeriodUS < 2) {
    halfPeriodUS = 2;
  }

  return halfPeriodUS;
}

// 移動中檢查 STOP
void checkStopCommandDuringMove() {
  static char stopBuf[16];
  static int stopIndex = 0;

  while (Serial.available() > 0) {
    char c = Serial.read();

    if (c == '\n' || c == '\r') {
      stopBuf[stopIndex] = '\0';

      if (strcmp(stopBuf, "STOP") == 0) {
        stopRequested = true;
      }

      stopIndex = 0;
    } 
    else {
      if (stopIndex < 15) {
        stopBuf[stopIndex++] = c;
      }
    }
  }
}

// 這個函式等同於你原本的 MotorRampStepSym
// 只是參數已經改成直觀版本：mm, mm/s, ramp mm
void moveLinearRampMM(
  bool dir,
  float distanceMM,
  float speedMM_S,
  float rampMM
) {
  if (distanceMM <= 0) {
    Serial.println("ERROR distance_must_be_positive");
    return;
  }

  if (speedMM_S <= 0) {
    Serial.println("ERROR speed_must_be_positive");
    return;
  }

  if (speedMM_S > MAX_SPEED_MM_S) {
    Serial.println("ERROR speed_too_high");
    return;
  }

  if (rampMM < 0) {
    Serial.println("ERROR ramp_must_be_nonnegative");
    return;
  }

  long totalSteps = mmToSteps(distanceMM);
  long rampSteps = mmToSteps(rampMM);

  if (totalSteps <= 0) {
    Serial.println("ERROR calculated_steps_zero");
    return;
  }

  if (rampSteps < 1) {
    rampSteps = 1;
  }

  // 如果加減速距離太長，自動縮短成總距離的一半
  if (2L * rampSteps > totalSteps) {
    rampSteps = totalSteps / 2;

    if (rampSteps < 1) {
      rampSteps = 1;
    }
  }

  unsigned long startDelay = speedToHalfPeriodUS(START_SPEED_MM_S);
  unsigned long minDelay   = speedToHalfPeriodUS(speedMM_S);

  if (startDelay < minDelay) {
    startDelay = minDelay;
  }

  long delta = (long)((startDelay - minDelay) / rampSteps);

  if (delta < 1) {
    delta = 1;
  }

  unsigned long d = startDelay;

  digitalWrite(dirPin, dir);

  isBusy = true;
  stopRequested = false;

  Serial.print("OK move_started ");
  Serial.print("dir=");
  Serial.print(dir ? 1 : 0);
  Serial.print(" distance_mm=");
  Serial.print(distanceMM, 3);
  Serial.print(" speed_mm_s=");
  Serial.print(speedMM_S, 3);
  Serial.print(" ramp_mm=");
  Serial.print(rampMM, 3);
  Serial.print(" total_steps=");
  Serial.print(totalSteps);
  Serial.print(" ramp_steps=");
  Serial.print(rampSteps);
  Serial.print(" start_delay_us=");
  Serial.print(startDelay);
  Serial.print(" min_delay_us=");
  Serial.println(minDelay);

  for (long i = 0; i < totalSteps; i++) {
    checkStopCommandDuringMove();

    if (stopRequested) {
      Serial.println("STOPPED");
      isBusy = false;
      return;
    }

    doStepPulse(d);

    if (i < rampSteps) {
      // 加速：delay 下降到 minDelay
      if (d > minDelay + delta) {
        d -= delta;
      } else {
        d = minDelay;
      }
    } 
    else if (i >= totalSteps - rampSteps) {
      // 減速：delay 上升回 startDelay
      d += delta;

      if (d > startDelay) {
        d = startDelay;
      }
    } 
    else {
      // 巡航：保持最高速度
      d = minDelay;
    }
  }

  isBusy = false;
  Serial.println("DONE");
}

// 指令格式：
// MOVE dir distance_mm speed_mm_s ramp_mm
//
// 範例：
// MOVE 1 5 3 1
void handleMoveCommand(char *cmd) {
  if (isBusy) {
    Serial.println("ERROR motor_busy");
    return;
  }

  char *token;

  token = strtok(cmd, " ");
  if (token == NULL || strcmp(token, "MOVE") != 0) {
    Serial.println("ERROR invalid_move_command");
    return;
  }

  token = strtok(NULL, " ");
  if (token == NULL) {
    Serial.println("ERROR missing_dir");
    return;
  }
  int dirInt = atoi(token);

  token = strtok(NULL, " ");
  if (token == NULL) {
    Serial.println("ERROR missing_distance");
    return;
  }
  float distanceMM = atof(token);

  token = strtok(NULL, " ");
  if (token == NULL) {
    Serial.println("ERROR missing_speed");
    return;
  }
  float speedMM_S = atof(token);

  token = strtok(NULL, " ");
  if (token == NULL) {
    Serial.println("ERROR missing_ramp");
    return;
  }
  float rampMM = atof(token);

  if (dirInt != 0 && dirInt != 1) {
    Serial.println("ERROR dir_must_be_0_or_1");
    return;
  }

  moveLinearRampMM(
    dirInt == 1,
    distanceMM,
    speedMM_S,
    rampMM
  );
}

void handleCommand(char *cmd) {
  if (strlen(cmd) == 0) {
    return;
  }

  if (strcmp(cmd, "PING") == 0) {
    Serial.println("PONG");
  }
  else if (strcmp(cmd, "STATUS") == 0) {
    if (isBusy) {
      Serial.println("BUSY");
    } else {
      Serial.println("IDLE");
    }
  }
  else if (strcmp(cmd, "STOP") == 0) {
    stopRequested = true;
    Serial.println("OK stop_requested");
  }
  else if (strcmp(cmd, "GET_CONFIG") == 0) {
    Serial.print("CONFIG steps_per_mm=");
    Serial.print(STEPS_PER_MM, 3);
    Serial.print(" start_speed_mm_s=");
    Serial.print(START_SPEED_MM_S, 3);
    Serial.print(" max_speed_mm_s=");
    Serial.println(MAX_SPEED_MM_S, 3);
  }
  else if (strncmp(cmd, "MOVE", 4) == 0) {
    handleMoveCommand(cmd);
  }
  else {
    Serial.println("ERROR unknown_command");
  }
}

void setup() {
  pinMode(stepPin, OUTPUT);
  pinMode(dirPin, OUTPUT);

  digitalWrite(stepPin, HIGH);
  digitalWrite(dirPin, HIGH);

  Serial.begin(115200);
  delay(500);

  Serial.println("READY");
}

void loop() {
  while (Serial.available() > 0) {
    char c = Serial.read();

    if (c == '\n' || c == '\r') {
      lineBuf[lineIndex] = '\0';

      if (lineIndex > 0) {
        handleCommand(lineBuf);
      }

      lineIndex = 0;
    }
    else {
      if (lineIndex < LINE_BUF_SIZE - 1) {
        lineBuf[lineIndex++] = c;
      }
    }
  }
}