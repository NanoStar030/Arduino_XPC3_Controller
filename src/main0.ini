#include <math.h>
#include <Arduino.h>

int stepPin = 13;
int dirPin = 12;

void MotorStep(bool dir, int step){
    digitalWrite(dirPin, dir);
    for(int i=0; i<step; i++){
      digitalWrite(stepPin, LOW);
      delayMicroseconds(300);
      digitalWrite(stepPin, HIGH);
      delayMicroseconds(300); //最快的速度
    }
}

void MotorLinearStep(bool dir, int step){
  digitalWrite(dirPin, dir);
  int minDelay = 50;  // 最小延遲 100us
  int maxDelay = 300; // 最大延遲 300us
  int delayTime = 300;
  for(int i = 0; i < step; i++){ // 線性增速/減速：隨著步數增加，逐步減小延遲時間
    if(i < step/2)
      delayTime = map(i, 0, int(step/2), maxDelay, minDelay);
    else
      delayTime = map(i, int(step/2), step, minDelay, maxDelay);
    digitalWrite(stepPin, LOW);
    delayMicroseconds(delayTime);
    digitalWrite(stepPin, HIGH);
    delayMicroseconds(delayTime);
  }
}

void MotorQuadStep(bool dir, int step){
  digitalWrite(dirPin, dir);
  int minDelay = 100;  // 最小延遲 100us
  int maxDelay = 300;  // 最大延遲 300us
  
  for(int i = 0; i < step; i++){ 
    int delayTime;
    float t = float(i) / float(step);  // 計算當前步數在總步數中的比例
    
    if(i < step / 2) {
      // 二次加速：加速過程為 t^2（平方）
      delayTime = map(t * t * step, 0, step, maxDelay, minDelay);
    } else {
      // 二次減速：減速過程為 (1-t)^2（平方）
      delayTime = map((1 - t) * (1 - t) * step, 0, step, minDelay, maxDelay);
    }
    
    digitalWrite(stepPin, LOW);
    delayMicroseconds(delayTime);
    digitalWrite(stepPin, HIGH);
    delayMicroseconds(delayTime);
  }
}

void MotorRampStep(bool dir, int step, int delayTime = 1600){
  digitalWrite(dirPin, dir);
  int minDelay = 1200;  // 最小延遲 100us
  int maxDelay = 2400;  // 最大延遲 300us
//  int delayTime = 1600;
  for(int i = 0; i < step; i++){ 
    digitalWrite(stepPin, LOW);
    delayMicroseconds(delayTime);
    digitalWrite(stepPin, HIGH);
    delayMicroseconds(delayTime);
    if(i<step-100){
      delayTime -= 1;
      if(delayTime < minDelay)
        delayTime = minDelay;
    }
    else if(step-100<=i){
      delayTime += 1;
      if(delayTime > maxDelay)
        delayTime = maxDelay;
    }
  }
}

void MotorRampStepSym(bool dir,
                      long steps,
                      int delayTimeStart,  // 起步(慢)
                      int rampSteps,
                      int minDelay
                      )        // 加速/減速各 rampSteps 步
{
  if (steps <= 0) return;

  digitalWrite(dirPin, dir);

  // 參數防呆
  if (delayTimeStart < minDelay) delayTimeStart = minDelay;
  if (rampSteps < 1) rampSteps = 1;

  // 若總步數太少，rampSteps 不能超過 steps/2（不然就沒有巡航段了）
  if (2L * rampSteps > steps) {
    rampSteps = steps / 2;  // 讓加速/減速仍對稱
    if (rampSteps < 1) rampSteps = 1;
  }

  // 每一步 delay 變化量（整數）
  int delta = (delayTimeStart - minDelay) / rampSteps;
  if (delta < 1) delta = 1; // 至少每步變 1，避免卡住

  int d = delayTimeStart;

  for (long i = 0; i < steps; i++) {

    // step pulse（你的寫法：LOW / HIGH 各 delay 一次）
    digitalWrite(stepPin, LOW);
    delayMicroseconds(d);
    digitalWrite(stepPin, HIGH);
    delayMicroseconds(d);

    // 三段：加速、巡航、減速（對稱）
    if (i < rampSteps) {
      // 加速：delay 下降到 minDelay
      d -= delta;
      if (d < minDelay) d = minDelay;

    } else if (i >= (steps - rampSteps)) {
      // 減速：delay 上升回 delayTimeStart
      d += delta;
      if (d > delayTimeStart) d = delayTimeStart;

    } else {
      // 巡航：保持最快
      d = minDelay;
    }
  }
}

void Ramp_Move_forward_and_back(int dist, int initDelay = 2500, int rampSteps = 100, int minDelay=150){
    MotorRampStepSym(false, dist, initDelay, rampSteps, minDelay);
    delay(500);
    MotorRampStepSym(true, dist, initDelay, rampSteps, minDelay);
    //delay(1000);
}
void Ramp_Move_back_and_forward(int dist, int initDelay = 2500, int rampSteps = 100, int minDelay=150){
    MotorRampStepSym(true, dist, initDelay, rampSteps, minDelay);
    delay(500);
    MotorRampStepSym(false, dist, initDelay, rampSteps, minDelay);
}
